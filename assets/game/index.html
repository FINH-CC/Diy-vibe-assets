<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Capybara Obby</title>
<link rel="stylesheet" href="styles.css"/>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<main id="root">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hud" hidden>
    <div class="hud-left">
      <span class="pill level-switch" id="levelPill" hidden>
        <span class="lvl-label">LEVEL</span>
        <button class="lvl-btn" data-lvl="0">1</button>
        <button class="lvl-btn" data-lvl="1">2</button>
        <button class="lvl-btn" data-lvl="2">3</button>
        <button class="lvl-btn" data-lvl="3">4</button>
        <button class="lvl-btn" data-lvl="4">5</button>
      </span>
      <button id="musicToggle" class="pill music-toggle" hidden title="Toggle music">🔊</button>
    </div>
    <span class="pill hud-center">⭐ <b id="score">0</b></span>
    <div class="hud-right" id="themeBar" hidden>
      <button class="theme-btn active" data-theme="cozy" title="Standard"><span style="background:#ffd5e3"></span></button>
      <button class="theme-btn" data-theme="jungle" title="Jungle"><span style="background:#7fd1a0"></span></button>
      <button class="theme-btn" data-theme="space" title="Space"><span style="background:linear-gradient(180deg,#1a0633,#5a1a8a)"></span></button>
      <button class="theme-btn" data-theme="sky" title="Blue Sky"><span style="background:#a9d9f9"></span></button>
    </div>
  </div>

  <p id="hint" class="hint">Arrow keys / WASD to move · SPACE to jump<span id="fartHint" hidden> · F to fart 💨</span></p>

  <!-- Mobile on-screen controls (shown only on touch devices) -->
  <div id="mobileControls" class="mobile-controls" hidden>
    <div id="joystick" class="joystick">
      <div id="joyKnob" class="joy-knob"></div>
    </div>
    <div class="action-stack">
      <button id="fartBtn" class="action-btn fart-btn" hidden>💨</button>
      <button id="jumpBtn" class="action-btn jump-btn">⤴</button>
    </div>
  </div>

  <!-- Title screen -->
  <div id="title" hidden>
    <div class="title-card">
      <div class="title-pedestal"></div>
      <h1 class="title-h1"><span>CAPYBARA</span><br/><b>OBBY</b></h1>
      <p class="title-tag">A game made by me</p>

      <div id="hatPicker" class="hat-picker" hidden>
        <span class="hat-label">PICK A HAT</span>
        <div class="hat-row">
          <button class="hat-btn active" data-hat="none" title="No hat"><span class="hat-3d hat-none"></span></button>
          <button class="hat-btn" data-hat="top" title="Top hat"><span class="hat-3d hat-top"></span></button>
          <button class="hat-btn" data-hat="cowboy" title="Cowboy"><span class="hat-3d hat-cowboy"></span></button>
          <button class="hat-btn" data-hat="orange" title="Orange"><span class="hat-3d hat-orange"></span></button>
          <button class="hat-btn" data-hat="crown" title="Crown"><span class="hat-3d hat-crown"></span></button>
        </div>
      </div>

      <button id="playBtn" class="lp-btn lp-btn-title">
        <span class="lp-face lp-bot"></span>
        <span class="lp-face lp-top"></span>
        <span class="lp-label">▶ PLAY</span>
      </button>
    </div>
  </div>

  <!-- Win screen -->
  <div id="win" hidden>
    <div class="win-confetti" aria-hidden="true">
      <i style="--x:4%;--d:2.6s;--dl:0s;--c:#ff6ad5"></i>
      <i style="--x:12%;--d:3.4s;--dl:.8s;--c:#ffd84a"></i>
      <i style="--x:20%;--d:2.9s;--dl:.3s;--c:#6affff"></i>
      <i style="--x:28%;--d:3.8s;--dl:1.4s;--c:#7fd1a0"></i>
      <i style="--x:36%;--d:2.7s;--dl:.6s;--c:#ffb37a"></i>
      <i style="--x:44%;--d:3.2s;--dl:1.9s;--c:#ff6ad5"></i>
      <i style="--x:52%;--d:2.5s;--dl:.2s;--c:#ffd84a"></i>
      <i style="--x:60%;--d:3.6s;--dl:1.1s;--c:#6affff"></i>
      <i style="--x:68%;--d:2.8s;--dl:.5s;--c:#7fd1a0"></i>
      <i style="--x:76%;--d:3.3s;--dl:1.6s;--c:#ffb37a"></i>
      <i style="--x:84%;--d:2.6s;--dl:.9s;--c:#ff6ad5"></i>
      <i style="--x:92%;--d:3.5s;--dl:.4s;--c:#ffd84a"></i>
      <i style="--x:8%;--d:3.1s;--dl:2.2s;--c:#7fd1a0"></i>
      <i style="--x:24%;--d:2.4s;--dl:1.7s;--c:#ffb37a"></i>
      <i style="--x:40%;--d:3.7s;--dl:.1s;--c:#6affff"></i>
      <i style="--x:56%;--d:2.9s;--dl:2.5s;--c:#ff6ad5"></i>
      <i style="--x:72%;--d:3.4s;--dl:1.3s;--c:#ffd84a"></i>
      <i style="--x:88%;--d:2.7s;--dl:2s;--c:#7fd1a0"></i>
    </div>
    <div class="win-burst" aria-hidden="true"></div>
    <div class="win-wrap">
      <div class="win-capy" aria-hidden="true">
        <span class="wc-ear wc-ear-l"></span>
        <span class="wc-ear wc-ear-r"></span>
        <span class="wc-head">
          <span class="wc-eye wc-eye-l"></span>
          <span class="wc-eye wc-eye-r"></span>
          <span class="wc-snout"></span>
        </span>
      </div>
      <div class="win-card">
        <h2 id="winTitle">YOU MADE IT! 🎉</h2>
        <div class="win-counter">
          <span class="win-counter-star">⭐</span>
          <b id="winScore">0</b>
          <span class="win-counter-label">stars collected</span>
        </div>
        <button id="againBtn" class="lp-btn">
          <span class="lp-face lp-bot"></span>
          <span class="lp-face lp-top"></span>
          <span class="lp-label">▶ Play Again</span>
        </button>
        <button id="nextLvlBtn" class="lp-btn lp-btn-green" hidden>
          <span class="lp-face lp-bot"></span>
          <span class="lp-face lp-top"></span>
          <span class="lp-label">→ Next Level</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Confetti / dance overlay -->
  <canvas id="fx" class="fx-overlay" hidden></canvas>
</main>
<script type="module" src="logic.js"></script>
</body></html>
